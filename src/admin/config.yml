backend:
  name: git-gateway
  branch: v1

locale: "fr"

# Production site (no trailing slash). Needed for the editor preview iframe and
# “view live” links on published entries. Use your Netlify URL or custom domain.
site_url: https://bonniols.netlify.app

# media_folder: src/assets/img
# public_folder: /assets/img

local_backend: true

media_library:
  name: cloudinary
  config:
    cloud_name: yxpagolc
    api_key: 825673371332129
    multiple: true

collections:
  - name: projects
    label: Projets
    label_singular: Projet
    folder: src/projects
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    identifier_field: title
    preview_path: "projects/{{slug}}/"
    editor:
      preview: true
    sortable_fields:
      - title
      - order
    fields:
      - name: title
        label: Titre
        widget: string
      - name: order
        label: Ordre
        widget: number
        value_type: int
        default: 0
        required: false
      - name: show_in_nav
        label: Afficher dans le menu
        widget: boolean
        default: true
        required: false
      - name: background_color
        label: Couleur de fond
        widget: color
        default: "#FFFFFF"
        required: false
      - name: body
        label: Texte
        widget: markdown
      - name: gallery
        label: Images
        widget: image
        allow_multiple: true
        required: false

  - name: navigation
    label: Navigation
    label_singular: Lien de menu
    folder: src/nav
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    identifier_field: eleventyNavigation.title
    fields:
      - name: eleventyNavigation
        label: Entrée de menu
        widget: object
        fields:
          - name: key
            label: Clé
            widget: string
            hint: "Identifiant unique (ex. projects, instagram). Utilisé comme parent pour les sous-menus."
          - name: title
            label: Libellé
            widget: string
          - name: url
            label: URL
            widget: string
            required: false
            hint: "Lien externe : URL complète (https://…). Lien interne : chemin du site (/, /projects/mon-projet/). Laisser vide pour un parent sans lien."
          - name: parent
            label: Parent
            widget: string
            required: false
            hint: "Clé du parent (ex. projects). Laisser vide pour un élément de premier niveau."
          - name: order
            label: Ordre
            widget: number
            value_type: int
            default: 0
      - name: permalink
        label: Permalink
        widget: hidden
        default: false
