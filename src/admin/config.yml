backend:
  name: git-gateway
  branch: v1

locale: "fr"

# Production site (no trailing slash). Needed for the editor preview iframe and
# “view live” links on published entries. Use your Netlify URL or custom domain.
site_url: https://bonniols.netlify.app

media_folder: src/assets/img
public_folder: /assets/img

local_backend: true

media_library:
  name: cloudinary
  config:
    cloud_name: yxpagolc
    api_key: 825673371332129
    # cloud_name: dgygqmduf
    # api_key: 568594127542439
    multiple: true

collections:
  - name: projects
    label: Projets
    label_singular: Projet
    folder: src/projects
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    identifier_field: title
    preview_path: "projects/{{slug}}/"
    editor:
      preview: true
    sortable_fields:
      - title
      - order
    fields:
      - name: title
        label: Titre
        widget: string
      - name: order
        label: Ordre
        widget: number
        value_type: int
        default: 0
        required: false
      - name: show_in_nav
        label: Afficher dans le menu
        widget: boolean
        default: true
        required: false
      - name: background_color
        label: Couleur de fond
        widget: color
        default: "#FFFFFF"
        required: false
      - name: invert_text_color
        label: Texte blanc
        widget: boolean
        default: false
        required: false
        hint: "Activer pour afficher le texte en blanc (utile sur fond sombre)."
      - name: use_background_color_in_slider
        label: Utiliser la couleur de fond pour le slider
        widget: boolean
        default: false
        required: false
        hint: "Activer pour utiliser la couleur de fond du projet dans le diaporama. Désactiver pour utiliser un gris neutre."
      - name: body
        label: Texte
        widget: markdown
      - name: gallery
        label: Images
        widget: image
        allow_multiple: true
        required: false

  - name: commands
    label: Commandes
    label_singular: Commande
    folder: src/commands
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    identifier_field: title
    preview_path: "commands/{{slug}}/"
    editor:
      preview: true
    sortable_fields:
      - title
      - order
    fields:
      - name: title
        label: Titre
        widget: string
      - name: order
        label: Ordre
        widget: number
        value_type: int
        default: 0
        required: false
      - name: show_in_nav
        label: Afficher dans le menu
        widget: boolean
        default: true
        required: false
      - name: background_color
        label: Couleur de fond
        widget: color
        default: "#FFFFFF"
        required: false
      - name: invert_text_color
        label: Texte blanc
        widget: boolean
        default: false
        required: false
        hint: "Activer pour afficher le texte en blanc (utile sur fond sombre)."
      - name: use_background_color_in_slider
        label: Utiliser la couleur de fond pour le slider
        widget: boolean
        default: true
        required: false
        hint: "Activer pour utiliser la couleur de fond du projet dans le diaporama. Désactiver pour utiliser un gris neutre."
      - name: body
        label: Texte
        widget: markdown
      - name: gallery
        label: Images
        widget: image
        allow_multiple: true
        required: false

  - name: pages
    label: Pages
    label_singular: Page
    folder: src/pages
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    identifier_field: title
    preview_path: "/{{slug}}/"
    editor:
      preview: true
    sortable_fields:
      - title
    fields:
      - name: title
        label: Titre
        widget: string
      - name: slug
        label: Slug
        widget: string
      - name: background_color
        label: Couleur de fond
        widget: color
        default: "#FFFFFF"
        required: false
      - name: invert_text_color
        label: Texte blanc
        widget: boolean
        default: false
        required: false
        hint: "Activer pour afficher le texte en blanc (utile sur fond sombre)."
      - name: body
        label: Texte
        widget: markdown

  - name: navigation
    label: Navigation
    label_singular: Lien de menu
    folder: src/nav
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    identifier_field: eleventyNavigation.title
    sortable_fields:
      - eleventyNavigation.title
      - eleventyNavigation.order
    fields:
      - name: eleventyNavigation
        label: Entrée de menu
        widget: object
        fields:
          - name: key
            label: Clé
            widget: string
            hint: "Identifiant unique (ex. projects, instagram). Utilisé comme parent pour les sous-menus."
          - name: title
            label: Libellé
            widget: string
          - name: url
            label: URL
            widget: string
            required: false
            hint: "Lien externe : URL complète (https://…). Lien interne : chemin du site (/, /projects/mon-projet/). Laisser vide pour un parent sans lien."
          - name: parent
            label: Parent
            widget: string
            required: false
            hint: "Clé du parent (ex. projects). Laisser vide pour un élément de premier niveau."
          - name: order
            label: Ordre
            widget: number
            value_type: int
            default: 0
      - name: permalink
        label: Permalink
        widget: hidden
        default: false

  - name: settings
    label: Paramètres
    files:
      - label: Accueil
        name: home
        file: src/_data/home.json
        fields:
          - name: use_alt_home_gallery
            label: Utiliser la galerie alternative pour l'image d'accueil
            widget: boolean
            default: false
            required: false
            hint: "Activer pour utiliser la galerie alternative pour l'image d'accueil. Désactiver pour utiliser la galerie standard."
          - name: standard_gallery
            label: Galerie standard
            widget: object
            fields:
              - name: gallery
                label: Images
                widget: image
                allow_multiple: true
                required: false
                hint: "L'image d'accueil est tirée au sort dans cette galerie."
              - name: url
                label: URL
                widget: string
                required: false
                hint: "Lien à appliquer sur l'image tirée au sort."
          - name: alt_gallery
            label: Galerie alternative
            widget: object
            fields:
              - name: gallery
                label: Images
                widget: image
                allow_multiple: true
                required: false
                hint: "L'image d'accueil est tirée au sort dans cette galerie."
              - name: url
                label: URL
                widget: string
                required: false
                hint: "Lien à appliquer sur l'image tirée au sort."
      - label: Navigation pied de page
        name: footer_nav
        file: src/_data/footer_nav.json
        fields:
          - name: links
            label: Liens
            widget: list
            required: false
            fields:
              - name: title
                label: Libellé
                widget: string
              - name: url
                label: URL
                widget: string
      - label: Textes
        name: text_labels
        file: src/_data/text_labels.json
        fields:
          - name: project_infos_label
            label: Label Texte/Info pour les projets
            widget: string
            required: false
            hint: "Laisser vide pour masquer le lien."
          - name: legals_body
            label: Texte mentions légales
            widget: markdown
            required: false
