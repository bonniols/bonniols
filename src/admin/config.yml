backend:
  name: git-gateway
  branch: v1

locale: "fr"

# Production site (no trailing slash). Needed for the editor preview iframe and
# “view live” links on published entries. Use your Netlify URL or custom domain.
site_url: https://bonniols.netlify.app

# media_folder: src/assets/img
# public_folder: /assets/img

local_backend: true

media_library:
  name: cloudinary
  config:
    cloud_name: yxpagolc
    api_key: 825673371332129
    multiple: true

collections:
  - name: projects
    label: Projects
    label_singular: Project
    folder: src/projects
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    identifier_field: title
    preview_path: "projects/{{slug}}/"
    editor:
      preview: true
    sortable_fields:
      - title
      - order
    fields:
      - label: Title
        name: title
        widget: string
      - label: Order
        name: order
        widget: number
        value_type: int
        default: 0
        required: false
      - label: Body
        name: body
        widget: markdown
      - label: Gallery
        name: gallery
        widget: image
        allow_multiple: true
        required: false
