<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager</title>
</head>

<body>
  <script src="/assets/vendor/markdown-it/markdown-it.min.js"></script>
  <script src="/assets/vendor/markdown-it-container/markdown-it-container.min.js"></script>
  <script src="/assets/js/cms-markdown.js"></script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    (function () {
      CMS.registerPreviewStyle("/assets/css/main.css");
      CMS.registerPreviewStyle("html, body { min-height: 100%; margin: 0; }", { raw: true });

      if (typeof createClass === "undefined" || typeof h === "undefined") {
        console.warn("Decap preview helpers missing; custom preview skipped.");
        return;
      }

      if (typeof window.createCmsMarkdownRenderer !== "function") {
        console.warn("CMS markdown renderer missing; preview will use default markdown.");
      }

      var cmsMarkdown = typeof window.createCmsMarkdownRenderer === "function"
        ? window.createCmsMarkdownRenderer()
        : null;

      function renderMarkdownBody(entry) {
        if (!cmsMarkdown) {
          return null;
        }

        return cmsMarkdown.render(entry.getIn(["data", "body"]) || "");
      }

      function pageBackground(entry) {
        return entry.getIn(["data", "background_color"]) || "#fafafa";
      }

      function applyPageBackground(doc, color) {
        if (!doc) return;

        doc.body.style.backgroundColor = color;
        doc.body.style.minHeight = "100%";
      }

      function clearPageBackground(doc) {
        if (!doc) return;

        doc.body.style.backgroundColor = "";
        doc.body.style.minHeight = "";
      }

      var TextContentPreview = createClass({
        displayName: "TextContentPreview",
        componentDidMount: function () {
          applyPageBackground(this.props.document, pageBackground(this.props.entry));
        },
        componentDidUpdate: function () {
          applyPageBackground(this.props.document, pageBackground(this.props.entry));
        },
        componentWillUnmount: function () {
          clearPageBackground(this.props.document);
        },
        render: function () {
          var title = this.props.entry.getIn(["data", "title"]);
          var invertText = this.props.entry.getIn(["data", "invert_text_color"]);
          var textClass = invertText ? "text-white" : "text-black";
          var bodyHtml = renderMarkdownBody(this.props.entry);
          var body =
            bodyHtml !== null
              ? h("div", {
                  className: "content-body",
                  dangerouslySetInnerHTML: { __html: bodyHtml },
                })
              : h("div", { className: "content-body" }, this.props.widgetFor("body"));

          return h(
            "article",
            { className: "container-regular py-8 md:py-12 " + textClass },
            h("h1", { className: "mb-6 text-3xl font-bold" }, title || "Untitled"),
            body,
          );
        },
      });

      CMS.registerPreviewTemplate("projects", TextContentPreview);
      CMS.registerPreviewTemplate("pages", TextContentPreview);
      CMS.registerPreviewTemplate("commands", TextContentPreview);
      CMS.registerPreviewTemplate("news", TextContentPreview);
    })();
  </script>
  <script type="text/javascript" src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</body>

</html>
